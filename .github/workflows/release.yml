name: Release device package

# Builds a ready-to-run next-dsky bundle for the Orange Pi (linux-arm64) and
# attaches it to a GitHub release. DSKYs in the field download these packages
# through the on-device updater (SETTINGS > UPDATE) — they never build anything
# themselves.
#
# To publish an update: git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build next-dsky (linux-arm64)
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: Programs/next-dsky
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Programs/next-dsky/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stamp version from tag
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Build
        run: npm run build

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      - name: Package
        run: |
          TARBALL="next-dsky-${GITHUB_REF_NAME}-linux-arm64.tar.gz"
          tar -czf "$RUNNER_TEMP/$TARBALL" \
            --exclude='./.next/cache' \
            --exclude='./.env' \
            --exclude='./ha_entities.json' \
            .
          cd "$RUNNER_TEMP"
          sha256sum "$TARBALL" > "$TARBALL.sha256"

      - name: Publish release
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARBALL="next-dsky-${GITHUB_REF_NAME}-linux-arm64.tar.gz"

          # Start from a clean slate: remove any prior release for this tag
          # (keep the git tag itself) so the create below is deterministic.
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag=false 2>/dev/null || true

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest \
            --verify-tag \
            "$TARBALL" "$TARBALL.sha256"

          # Assert the release actually exists with both assets attached —
          # fail loudly here rather than reporting a misleading success.
          echo "Published assets:"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          ASSET_COUNT=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          if [ "$ASSET_COUNT" -lt 2 ]; then
            echo "::error::Expected 2 assets, found $ASSET_COUNT"
            exit 1
          fi
